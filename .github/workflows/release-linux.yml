name: Release Linux
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/linux/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a linux-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-linux, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/linux/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux native hosts
        run: bash platforms/linux/build-container.sh
      - name: Package Linux release
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: tar -czf "msime-linux-${VERSION}.tar.gz" -C target/linux-build-gate cmake
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-linux-${{ steps.version.outputs.value }}
          path: msime-linux-${{ steps.version.outputs.value }}.tar.gz
          if-no-files-found: error
      # workflow_dispatch runs on whatever ref it is given, so publishing has to be asked for rather
      # than implied. Without the gate a dispatch on a feature branch cuts a real public release.
      - name: Publish independent Linux release
        if: ${{ inputs.publish }}
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.version.outputs.value }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          # --generate-notes otherwise starts from whichever tag in the repository is newest, and the six platforms interleave prefixes, so a macOS release could be described by the diff since an ios-v tag. fetch-depth: 0 above is what makes this list complete.
          start=$(git tag --list 'linux-v*' --sort=-v:refname | head -1)
          tag="linux-v${VERSION}"; flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          [[ -n "$start" ]] && flags+=(--notes-start-tag "$start")
          gh release create "$tag" "msime-linux-${VERSION}.tar.gz" --target "$GITHUB_SHA" --title "Linux ${VERSION}" --generate-notes "${flags[@]}"
