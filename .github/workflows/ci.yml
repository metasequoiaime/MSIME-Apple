name: CI

on:
  push:
    branches:
      - develop
      - main
    # Prose that no build step compiles. A change confined to these paths held a macOS 15 x86_64 runner for the full iOS interface suite to prove nothing, and the release build on main queued behind it. ci-docs.yml answers for the required checks on exactly this list, so those pull requests stay mergeable, and it calls contracts.yml as well -- README.md, PRIVACY.md and the architecture document are asserted on by ReleaseConfigurationTests, and that suite runs on Linux, so ignoring them here keeps the assertions and drops only the matrix.
    #
    # LICENSE and THIRD_PARTY_NOTICES.txt stay off the list on purpose: CMake installs them into the bundle, so they are build inputs rather than prose. A new documentation file is not ignored until someone adds it here, which fails toward running CI.
    paths-ignore:
      - CHANGELOG.md
      - PRIVACY.md
      - README.en.md
      - README.md
      - docs/apple-platform-architecture.md
      - docs/backend-integration.md
      - docs/ios-distribution.md
      - docs/plans/**
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - PRIVACY.md
      - README.en.md
      - README.md
      - docs/apple-platform-architecture.md
      - docs/backend-integration.md
      - docs/ios-distribution.md
      - docs/plans/**
  workflow_dispatch:
    inputs:
      mac_only:
        description: "Run only the macOS validation jobs"
        required: false
        type: boolean
        default: false

  merge_group:

concurrency:
  # Keyed by event as well as branch: the release scripts dispatch this workflow and wait on that exact run, so a pull_request run on the same branch must not cancel it. Feature branches only ever get the pull_request run (push is restricted to develop and main), so this still collapses superseded runs of the same kind.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # Minutes into the run rather than after the macOS build that ctest waits for. The macOS job still runs the same suite through ctest, including the cases this one skips for want of Apple tooling.
  contracts:
    uses: ./.github/workflows/contracts.yml

  macos:
    name: macOS 15 ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cheap and runs before the build so a formatting slip fails in seconds rather than after the
      # full compile. Formatting is architecture independent, so only one leg checks it. Same
      # pinned formatter version as MSIME-Linux and MSIME-Engine.
      - name: Check formatting
        if: ${{ matrix.architecture == 'arm64' }}
        run: scripts/format.sh --check
      # runner 上下文在 job 级 env 里不可用,所以在这里写进 GITHUB_ENV,后面的步骤都能读到。
      - name: Point the Sparkle download at the cache
        run: echo "METASEQUOIA_SPARKLE_CACHE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Cache the pinned Sparkle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle
          # 版本和摘要都写在 CMakeLists.txt 里,所以按它的哈希做键:版本一动键就变,不会用到旧归档。
          key: sparkle-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Remove unused runner taps
        run: if brew tap | grep -Fxq aws/tap; then brew untap aws/tap; fi
      - name: Install dependencies
        run: brew install boost fmt spdlog nlohmann-json
      # Against /usr/bin/python3 specifically, which is the Command Line Tools interpreter a
      # contributor gets by default and is several minor versions behind the runner's python3. A
      # PEP 701 f-string shipped in fetch_dictionary.py and broke build.sh on a clean machine while
      # CI stayed green, because CI never ran it under that interpreter.
      - name: Check the tooling parses under the stock macOS interpreter
        run: /usr/bin/python3 -m compileall -q scripts platforms/macos/tests platforms/ios/scripts platforms/ios/tests
      # CMake prepares the Engine on configure, but the checks below read it first. The fetch is a no-op once the tree matches the lock, so the later configure pays nothing.
      - name: Prepare the locked Engine archive
        run: python3 scripts/fetch_engine.py
      - name: Validate the product lock
        run: |
          python3 scripts/check-dictionary-contract.py
          python3 scripts/check-product-lock-contract.py
          python3 scripts/product_lock.py validate
          python3 platforms/macos/tests/ProductLockTests.py
      # The unit tests run against a fixture rather than the released database: they assert behaviour
      # around composition, not dictionary content, and downloading 100 MB per run to do it would buy
      # nothing. The release build is what verifies the real data, against the digests in the lock.
      - name: Create test dictionary
        run: python3 platforms/macos/tests/create_fixture_dictionary.py "$RUNNER_TEMP/msime.db"
      - name: Type-check registration helper
        run: xcrun swiftc -typecheck platforms/macos/scripts/register_input_source.swift
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DMETASEQUOIA_IME_DICTIONARY="$RUNNER_TEMP/msime.db"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --no-tests=error --test-dir build --output-on-failure --timeout 20
      - name: Verify input method bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/MetasequoiaIME.app
          lipo build/MetasequoiaIME.app/Contents/MacOS/MetasequoiaIME -verify_arch arm64 x86_64
          plutil -lint build/MetasequoiaIME.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' build/MetasequoiaIME.app/Contents/Info.plist)" = "app.msime.inputmethod.MetasequoiaIME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TISIntendedLanguage' build/MetasequoiaIME.app/Contents/Info.plist)" = "zh-Hans"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsInputModeListKey:app.msime.inputmethod.MetasequoiaIME.Hans:tsInputModeScriptKey' build/MetasequoiaIME.app/Contents/Info.plist)" = "smSimpChinese"

  # MSIME-Linux's ci.yml already reasons this out: "the frontend layer had none -- and that is the
  # layer that parses untrusted input", written after an audit of a sibling frontend turned up a
  # batch of races and null dereferences that no Debug build would have caught. Linux acted on it;
  # this repository had no sanitizer coverage at all, and it is the cheapest of the three to add
  # because clang is native here and there is no package manager tree to rebuild.
  #
  # arm64 only: this catches memory and undefined-behaviour bugs, which are not architecture
  # specific, and a second sanitized leg would double a 60-plus-minute job for very little.
  sanitizers:
    name: Sanitizers
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner 上下文在 job 级 env 里不可用,所以在这里写进 GITHUB_ENV,后面的步骤都能读到。
      - name: Point the Sparkle download at the cache
        run: echo "METASEQUOIA_SPARKLE_CACHE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Cache the pinned Sparkle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle
          # 版本和摘要都写在 CMakeLists.txt 里,所以按它的哈希做键:版本一动键就变,不会用到旧归档。
          key: sparkle-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Remove unused runner taps
        run: if brew tap | grep -Fxq aws/tap; then brew untap aws/tap; fi
      - name: Install dependencies
        run: brew install boost fmt spdlog nlohmann-json
      - name: Create test dictionary
        run: |
          mkdir -p "$RUNNER_TEMP/dictionary"
          python3 platforms/macos/tests/create_fixture_dictionary.py "$RUNNER_TEMP/dictionary/msime.db"
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DMETASEQUOIA_IME_DICTIONARY="$RUNNER_TEMP/dictionary/msime.db"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      # detect_leaks is off because Apple's runtime ships no LeakSanitizer; the Linux job in the
      # engine repository is where leak detection happens.
      - name: Test memory safety and undefined behavior
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --no-tests=error --test-dir build-sanitizers --output-on-failure --timeout 300

  ios:
    name: iOS Simulator
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac_only != true }}
    # Everything except the three handwriting cases, on arm64, always. Only MLKitDigitalInkRecognition
    # needs an Intel runner -- its arm64 slice is built for devices, so there is none to link against
    # on an Apple Silicon Simulator -- and only MetasequoiaKeyboardTests/HandwritingTests needs it.
    # The interface suite does not, and used to be dragged onto Intel with it: a twenty-five minute
    # test build before a case ran, then thirty-seven cases on a Simulator half the speed of an arm64
    # one. The handwriting cases are their own job now, so neither waits on the other.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MSIME_IOS_SKIP_HANDWRITING: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project generator
        run: |
          brew install boost fmt spdlog nlohmann-json xcodegen
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Test shared account transport and session lifecycle
        run: swift test --package-path shared/backend
      # CMake prepares the Engine on configure, but the checks below read it first. The fetch is a no-op once the tree matches the lock, so the later configure pays nothing.
      - name: Prepare the locked Engine archive
        run: python3 scripts/fetch_engine.py
      - name: Validate keyboard configuration
        run: |
          python3 platforms/ios/tests/ProjectConfigurationTests.py
          python3 platforms/ios/tests/DictionaryPackagingTests.py
      - name: Package iOS dictionary
        run: python3 platforms/ios/scripts/prepare_dictionary.py
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root .
          if [ "${MSIME_IOS_SKIP_HANDWRITING}" != "1" ]; then
            pod install --deployment --project-directory=platforms/ios
          fi
      - name: Test native iOS keyboard and settings
        # A pull request runs the unit suites and a handful of interface cases; a merge runs
        # everything. The interface suite dominates either way -- each case is a cold launch and a
        # walk through the app -- so the merge scope runs its classes across cloned Simulators
        # rather than one after another. The runner has the cores; a single Simulator was leaving
        # most of them idle.
        #
        # The cap is what the whole suite took on arm64 before that, with room to spare, rather than
        # a number the suite has to fit inside. The 110 it used to carry was for an Intel runner
        # doing this work on a Simulator half the speed, and a 25-minute build in front of it.
        env:
          MSIME_TEST_SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || 'all' }}
        timeout-minutes: 45
        run: bash platforms/ios/scripts/run_ui_tests.sh
      - name: Upload iOS test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: build/ios-derived/Logs/Test/*.xcresult
          retention-days: 7

  ios-handwriting:
    name: iOS Handwriting
    # The three cases that need MLKitDigitalInkRecognition, which has no arm64 Simulator slice, and
    # therefore the only ones that still need an Intel runner. They are here rather than in the job
    # above so that the interface suite does not wait behind an Intel build for a dependency it does
    # not use. Deferred to merge for the same reason the whole suite used to be: the build in front
    # of three cases costs more than the cases do, and a review signal is not worth that.
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.mac_only != true) }}
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MSIME_IOS_SKIP_HANDWRITING: '0'
      MSIME_TEST_SCOPE: handwriting
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project generator
        run: |
          brew install boost fmt spdlog nlohmann-json xcodegen
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Prepare the locked Engine archive
        run: python3 scripts/fetch_engine.py
      - name: Package iOS dictionary
        run: python3 platforms/ios/scripts/prepare_dictionary.py
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root .
          pod install --deployment --project-directory=platforms/ios
      - name: Test handwriting recognition
        run: bash platforms/ios/scripts/run_ui_tests.sh
      - name: Upload handwriting test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-handwriting-test-results
          path: build/ios-derived/Logs/Test/*.xcresult
          retention-days: 7
