name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test -p msime-client-core --locked
      - run: cargo clippy -p msime-client-core --all-targets --locked -- -D warnings
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @msime/desktop test
      - run: pnpm build
      - run: cargo test -p msime-client-core -p msime-desktop --locked
      - run: pnpm tauri build --debug --no-bundle
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libboost-dev libfmt-dev libspdlog-dev libsqlite3-dev
      - if: runner.os == 'macOS'
        run: brew install boost fmt spdlog
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install boost-headers fmt spdlog sqlite3 --triplet x64-windows-static-md --classic
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "VCPKG_TARGET_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
      - if: runner.os == 'macOS'
        run: echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
      - run: cargo test -p msime-engine-bridge --locked
