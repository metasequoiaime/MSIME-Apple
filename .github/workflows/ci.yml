name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      mac_only:
        description: "Run only the macOS validation jobs"
        required: false
        type: boolean
        default: false

concurrency:
  # Keyed by event as well as branch: the release scripts dispatch this workflow and wait on that exact run, so a pull_request run on the same branch must not cancel it. Feature branches only ever get the pull_request run (push is restricted to main), so this still collapses superseded runs of the same kind.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS 15 ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Remove unused runner taps
        run: if brew tap | grep -Fxq aws/tap; then brew untap aws/tap; fi
      - name: Install dependencies
        run: brew install boost fmt spdlog nlohmann-json
      # Against /usr/bin/python3 specifically, which is the Command Line Tools interpreter a
      # contributor gets by default and is several minor versions behind the runner's python3. A
      # PEP 701 f-string shipped in fetch_dictionary.py and broke build.sh on a clean machine while
      # CI stayed green, because CI never ran it under that interpreter.
      - name: Check the tooling parses under the stock macOS interpreter
        run: /usr/bin/python3 -m compileall -q scripts platforms/macos/tests platforms/ios/scripts platforms/ios/tests
      - name: Validate the product lock
        run: |
          python3 scripts/check-dictionary-contract.py
          python3 scripts/product_lock.py validate
          python3 platforms/macos/tests/ProductLockTests.py
      # The unit tests run against a fixture rather than the released database: they assert behaviour
      # around composition, not dictionary content, and downloading 100 MB per run to do it would buy
      # nothing. The release build is what verifies the real data, against the digests in the lock.
      - name: Create test dictionary
        run: python3 platforms/macos/tests/create_fixture_dictionary.py "$RUNNER_TEMP/msime.db"
      - name: Type-check registration helper
        run: xcrun swiftc -typecheck platforms/macos/scripts/register_input_source.swift
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DMETASEQUOIA_IME_DICTIONARY="$RUNNER_TEMP/msime.db"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 20
      - name: Verify input method bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/MetasequoiaIME.app
          lipo build/MetasequoiaIME.app/Contents/MacOS/MetasequoiaIME -verify_arch arm64 x86_64
          plutil -lint build/MetasequoiaIME.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' build/MetasequoiaIME.app/Contents/Info.plist)" = "com.houko.inputmethod.MetasequoiaIME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TISIntendedLanguage' build/MetasequoiaIME.app/Contents/Info.plist)" = "zh-Hans"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsInputModeListKey:com.houko.inputmethod.MetasequoiaIME.Hans:tsInputModeScriptKey' build/MetasequoiaIME.app/Contents/Info.plist)" = "smSimpChinese"

  ios:
    name: iOS Simulator
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac_only != true }}
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install project generator
        run: brew install boost fmt spdlog nlohmann-json xcodegen
      - name: Validate keyboard configuration
        run: |
          python3 platforms/ios/tests/ProjectConfigurationTests.py
          python3 platforms/ios/tests/DictionaryPackagingTests.py
      - name: Package iOS dictionary
        run: python3 platforms/ios/scripts/prepare_dictionary.py
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root .
      - name: Build host app and keyboard extension
        run: |
          xcodebuild \
            -project build/ios/MetasequoiaImeIOS.xcodeproj \
            -scheme MetasequoiaImeIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test native iOS onboarding
        timeout-minutes: 15
        run: bash platforms/ios/scripts/run_ui_tests.sh
