name: Release iOS
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/ios/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-ios, cancel-in-progress: false}
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: version
        name: Resolve independent iOS version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/ios/version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build native iOS host
        run: bash platforms/ios/build-app.sh resources simulator
      - name: Package iOS release
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          mkdir -p dist
          ditto target/ios/derived-simulator/Build/Products/Release-iphonesimulator/MSIMEClientApp.app "dist/MSIMEClientApp-${VERSION}.app"
          tar -czf "dist/msime-ios-${VERSION}.tar.gz" -C dist "MSIMEClientApp-${VERSION}.app"
      - name: Publish independent iOS release
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.version.outputs.value }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          tag="ios-v${VERSION}"
          flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease); gh release create "$tag" "dist/msime-ios-${VERSION}.tar.gz" --target "$GITHUB_SHA" --title "iOS ${VERSION}" --generate-notes "${flags[@]}"
