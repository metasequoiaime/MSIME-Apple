name: Release Android
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/android/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-android, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/android/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build native Android host
        run: bash platforms/android/build-apk.sh resources
      - name: Publish independent Android release
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.version.outputs.value }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          tag="android-v${VERSION}"; flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease); gh release create "$tag" target/android/msime-client.apk --target "$GITHUB_SHA" --title "Android ${VERSION}" --generate-notes "${flags[@]}"
