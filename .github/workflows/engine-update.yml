name: Engine dependency update

on:
  repository_dispatch:
    types: [engine-release]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# repository_dispatch fires on every upstream release and the cron fires weekly, so two runs can
# otherwise be force-pushing the same automation/engine-<sha> branch at once.
concurrency:
  group: engine-update
  cancel-in-progress: false

jobs:
  update:
    # Pinned like every other job in this repository. ubuntu-latest migrates to Ubuntu 26 from
    # 2026-10-19, and this workflow holds a PAT and contents: write -- not the place to find out.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the locked Engine archive
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/metasequoiaime/msime-engine.git refs/heads/main | cut -f1)"
          current="$(python3 -c 'import json; print(json.load(open("engine-lock.json"))["commit"])')"
          if [ "$commit" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/relock_engine.py "$commit"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          # GITHUB_TOKEN 开不了 PR:组织把「Allow GitHub Actions to create and approve pull requests」关着,gh pr create 直接被拒 —— 分支推上去了,PR 没有,引擎更新静悄悄地停住,只有翻 Actions 才看得见。
          #
          # 用和 release-please 同一个凭据,理由见 release-*.yml 里那条注释。留 GITHUB_TOKEN 作回退,让没配这个 secret 的分叉至少还能推出分支。
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          branch="automation/engine-${{ steps.update.outputs.commit }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add engine-lock.json
          git commit -m "build: update MSIME-Engine dependency"
          git push --force origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "build: update MSIME-Engine dependency" \
            --body "Updates the verified MSIME-Engine archive to commit ${{ steps.update.outputs.commit }}. CI must pass before merging."
