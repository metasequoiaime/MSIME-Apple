name: Engine dependency update

on:
  repository_dispatch:
    types: [engine-release]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update the locked Engine archive
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/metasequoiaime/MSIME-Engine.git refs/heads/main | cut -f1)"
          current="$(python3 -c 'import json; print(json.load(open("engine-lock.json"))["commit"])')"
          if [ "$commit" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          archive="https://github.com/metasequoiaime/MSIME-Engine/archive/${commit}.tar.gz"
          curl --fail --location --silent --show-error "$archive" -o /tmp/engine.tar.gz
          sha256="$(sha256sum /tmp/engine.tar.gz | cut -d' ' -f1)"
          python3 - "$commit" "$archive" "$sha256" <<'PY'
          import json, sys
          path = "engine-lock.json"
          data = json.load(open(path))
          data.update(commit=sys.argv[1], archive=sys.argv[2], sha256=sys.argv[3])
          open(path, "w").write(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/engine-${{ steps.update.outputs.commit }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add engine-lock.json
          git commit -m "build: update MSIME-Engine dependency"
          git push --force origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "build: update MSIME-Engine dependency" \
            --body "Updates the verified MSIME-Engine archive to commit ${{ steps.update.outputs.commit }}. CI must pass before merging."
