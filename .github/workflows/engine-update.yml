name: Engine dependency update

on:
  repository_dispatch:
    types: [engine-release]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the locked Engine archive
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/metasequoiaime/MSIME-Engine.git refs/heads/main | cut -f1)"
          current="$(python3 -c 'import json; print(json.load(open("engine-lock.json"))["commit"])')"
          if [ "$commit" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/relock_engine.py "$commit"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/engine-${{ steps.update.outputs.commit }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add engine-lock.json
          git commit -m "build: update MSIME-Engine dependency"
          git push --force origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "build: update MSIME-Engine dependency" \
            --body "Updates the verified MSIME-Engine archive to commit ${{ steps.update.outputs.commit }}. CI must pass before merging."
