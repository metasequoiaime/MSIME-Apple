name: Release macOS
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/macos/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-macos, cancel-in-progress: false}
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: version
        name: Resolve independent macOS version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/macos/version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build macOS native host
        run: |
          cargo build --locked -p msime-host-api
          cmake -S platforms/macos -B target/macos-release -DCMAKE_BUILD_TYPE=Release
          cmake --build target/macos-release --config Release
      - name: Package macOS release
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: tar -czf "msime-macos-${VERSION}.tar.gz" -C target/macos-release .
      - name: Publish independent macOS release
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.version.outputs.value }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          tag="macos-v${VERSION}"
          flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease); gh release create "$tag" "msime-macos-${VERSION}.tar.gz" --target "$GITHUB_SHA" --title "macOS ${VERSION}" --generate-notes "${flags[@]}"
