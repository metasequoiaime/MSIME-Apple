name: CodeQL
on:
  schedule:
    # Daily at 00:00 Asia/Tokyo (UTC+09:00).
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          # C/C++ source analysis complements, rather than replaces, native build CI.
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:${{ matrix.language }}'

  swift:
    name: CodeQL / Swift
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # The same Xcode the simulator CI and the release build use: the keyboard calls iOS 26 API, which the runner's default Xcode 16.4 (iOS 18.5 SDK) cannot compile.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies and Xcode generator
        run: brew install boost fmt spdlog nlohmann-json xcodegen cocoapods
      - name: Prepare the same dictionary as simulator CI
        run: python3 platforms/ios/scripts/prepare_dictionary.py
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root .
          pod install --deployment --project-directory=platforms/ios
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: swift
          build-mode: manual
      - name: Build the app and keyboard for analysis
        run: >-
          xcodebuild -workspace build/ios/MetasequoiaImeIOS.xcworkspace
          -scheme MetasequoiaImeIOS -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/codeql-ios CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:swift'
