name: Bug report
description: Report a reproducible problem without including private input or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, real typed text, personal data, private paths, or security-sensitive details. Use the private security report link for vulnerabilities.
  - type: input
    id: platform
    attributes:
      label: Platform and version
      description: Include the OS, architecture, and the 水杉输入法 commit or package version.
      placeholder: e.g. Linux arm64 container, commit abc1234
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic input and a minimal sequence of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already run
      description: List local commands or platform tests and their results. Do not paste secrets or raw input.
