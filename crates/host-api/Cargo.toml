[package]
name = "msime-host-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
msime-client-core = { path = "../client-core" }
msime-engine-bridge = { path = "../engine-bridge" }
msime-input-runtime = { path = "../input-runtime" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2 = "0.10"
time = "0.3"

[dev-dependencies]
rusqlite = "0.32"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Globalization"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
