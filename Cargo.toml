[workspace]
members = ["crates/client-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/metasequoiaime/MSIME-Client"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
