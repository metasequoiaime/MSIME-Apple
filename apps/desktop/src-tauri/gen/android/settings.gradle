include ':app'

// Keep the generated project usable after a fresh clone. Tauri normally writes
// tauri.settings.gradle with an absolute cargo-registry path, but that file is
// intentionally ignored because the path is machine-specific.
def configuredTauriAndroidDir = System.getenv('TAURI_ANDROID_DIR')
def cargoHome = System.getenv('CARGO_HOME')
    ? file(System.getenv('CARGO_HOME'))
    : file(new File(System.getProperty('user.home'), '.cargo'))
def registrySource = new File(cargoHome, 'registry/src')
def tauriCandidates = []
registrySource.listFiles()?.each { indexRoot ->
    indexRoot.listFiles()?.each { crateRoot ->
        def androidProject = new File(crateRoot, 'mobile/android')
        if (androidProject.isDirectory()) tauriCandidates.add(androidProject)
    }
}
def tauriAndroidDir = configuredTauriAndroidDir
    ? file(configuredTauriAndroidDir)
    : (tauriCandidates.size() == 1 ? tauriCandidates.first() : null)
if (tauriAndroidDir == null || !tauriAndroidDir.isDirectory()) {
    throw new GradleException('Locked Tauri Android sources not found; set TAURI_ANDROID_DIR or install exactly one tauri crate')
}
include ':tauri-android'
project(':tauri-android').projectDir = tauriAndroidDir
