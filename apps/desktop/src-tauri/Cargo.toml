[package]
name = "msime-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "msime_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
msime-client-core = { path = "../../../crates/client-core" }
msime-host-api = { path = "../../../crates/host-api" }
msime-input-runtime = { path = "../../../crates/input-runtime" }
serde_json.workspace = true
tempfile.workspace = true
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Desktop shells reuse one process and hand off surface routes to it.
tauri-plugin-single-instance = "2.4"

[target.'cfg(windows)'.dependencies]
# Foreground capture, synthetic input and shell access for the shared panels.
msime-host-windows = { path = "../../../crates/host-windows" }

[lints]
workspace = true
