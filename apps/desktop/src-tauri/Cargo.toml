[package]
name = "msime-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "msime_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
msime-client-core = { path = "../../../crates/client-core" }
msime-host-api = { path = "../../../crates/host-api" }
msime-input-runtime = { path = "../../../crates/input-runtime" }
serde_json.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
uuid = "1"
msime-tauri-mobile-platform = { path = "../../../crates/tauri-mobile-platform" }

[target.'cfg(target_os = "ios")'.dependencies]
msime-ios-native-ffi = { path = "../../../crates/ios-native-ffi" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
msime-host-macos = { path = "../../../crates/host-macos" }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# Desktop shells reuse one process and hand off surface routes to it.
tauri-plugin-single-instance = "2.4"

[target.'cfg(windows)'.dependencies]
# Foreground capture, synthetic input and shell access for the shared panels.
msime-host-windows = { path = "../../../crates/host-windows" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
msime-tauri-mobile-platform = { path = "../../../crates/tauri-mobile-platform" }

[lints]
workspace = true
