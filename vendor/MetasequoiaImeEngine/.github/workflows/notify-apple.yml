name: Notify Apple frontend
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify MSIME-Apple
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            /repos/metasequoiaime/MSIME-Apple/dispatches \
            -f event_type=engine-release \
            -f "client_payload[tag]=$RELEASE_TAG" \
            -f "client_payload[commit]=$RELEASE_COMMIT"
