# The iOS library is consumed as the static `libapp.a` the Tauri CLI hands to Xcode, but
# `cargo build --lib` also produces the cdylib, and that one has to link on its own. Four of its
# symbols are Swift `@_cdecl` exports -- the personal-dictionary and snapshot bridges -- which
# Xcode compiles into the app target, so they do not exist yet when cargo links. Deferring their
# resolution is what lets the documented iOS build get past that link; the app binary still
# resolves them for real when Xcode links the static library against the Swift objects.
#
# Scoped to the two iOS targets on purpose. A workspace-wide relaxation would hide genuinely
# missing symbols on every other platform, which is the failure this exists to avoid.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
