<?xml version="1.0" encoding="UTF-8"?>
<!--
  The input menu's icon: the 水杉 mark as a single stroke, drawn as a template so the menu bar can tint
  it for light, dark and the highlighted menu.

  The square viewBox is the stroke's own bounds grown by a thirty-second of a side on each edge, and is
  computed by platforms/macos/scripts/render_menu_icon.swift. The menu gets a square tile; a taller one is
  read as a 32-point image and cropped to its middle, which arrives as a solid block. Edit the path here,
  then rerun that script to rewrite MSIMEClientInputMethodMenuIcon.tiff.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0.496 2.968 31.199 31.199">
  <title>水杉输入法 input menu icon</title>
  <path
    d="M25 6.5 7.5 14 24.5 18.25 7.5 25.75c4.5 3.5 10.5 5.25 17.5 2.75"
    fill="none"
    stroke="#000"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="4.5"
  />
</svg>
