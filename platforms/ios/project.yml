name: MetasequoiaImeIOS

options:
  bundleIdPrefix: app.msime
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    # Bumped by release-please alongside CMakeLists.txt. It used to be pinned at 0.1.0 while the
    # project shipped 0.45.x, so any iOS artifact would have carried a version that matched nothing.
    MARKETING_VERSION: 0.48.0 # x-release-please-version
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    # Xcode 26 no longer falls back to the target name when a target leaves PRODUCT_NAME unset, so a
    # target without it links as a bare `-l` and builds products named `.xctest` or `-Runner.app`.
    # Targets that publish a different product name still override this below.
    PRODUCT_NAME: $(TARGET_NAME)
    DEVELOPMENT_TEAM: LXCL4Z68GU

targets:
  MetasequoiaAppleBridge:
    type: library.static
    platform: iOS
    sources:
      - path: shared/apple-bridge
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/common
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/core
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/english
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/japanese
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/local_modes
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/providers
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/quanpin
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/schemes
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/shuangpin
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/user_dictionary
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/googlepinyinime-rev/src/share
        excludes:
          - "*.h"
          - maintest.cpp
    settings:
      base:
        BREW_PREFIX: /opt/homebrew
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - FMT_HEADER_ONLY=1
          - SPDLOG_FMT_EXTERNAL
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../shared/apple-bridge
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/utfcpp/source
          - $(BREW_PREFIX)/include
        SKIP_INSTALL: YES

  MetasequoiaImeIOS:
    type: application
    platform: iOS
    sources:
      - path: platforms/ios/App/Sources
      - path: platforms/ios/SharedUI
      - path: platforms/ios/SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # GPLv3 sections 4 and 6 require the licence to reach whoever receives the program, and the
      # bundled msime.db is built from rime-ice, which is itself GPL-3.0. macOS already packages
      # these into Resources/Licenses via CMakeLists.txt; iOS shipped neither. They go on the host
      # app rather than the keyboard extension because the extension has no UI that could present
      # them.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: $(PROJECT_DIR)/../../platforms/ios/App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(PROJECT_DIR)/../../platforms/ios/App/Resources/MetasequoiaImeIOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios
        PRODUCT_NAME: MetasequoiaIME
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: MetasequoiaKeyboard

  MetasequoiaKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: platforms/ios/KeyboardExtension/Sources
      - path: platforms/ios/SharedUI
      - path: platforms/ios/SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/msime.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/msime.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/dictionary-manifest.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Resources/MetasequoiaKeyboard.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboard
        PRODUCT_NAME: MetasequoiaKeyboard
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Sources/MetasequoiaKeyboard-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../shared/apple-bridge
    dependencies:
      - target: MetasequoiaAppleBridge
      - sdk: libsqlite3.tbd

  MetasequoiaImeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: platforms/ios/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.uitests
    dependencies:
      - target: MetasequoiaImeIOS

schemes:
  MetasequoiaImeIOS:
    build:
      targets:
        MetasequoiaImeIOS: all
        MetasequoiaKeyboard: all
    run:
      config: Debug
    test:
      targets:
        - MetasequoiaImeIOSUITests
