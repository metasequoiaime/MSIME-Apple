name: MetasequoiaImeIOS

options:
  bundleIdPrefix: app.msime
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    BREW_PREFIX: /opt/homebrew
    # Only used by local Xcode builds, which never upload. The release scripts override it with the
    # commit count, because App Store Connect wants this unique and increasing inside one
    # MARKETING_VERSION and would reject a second upload that reused the value.
    CURRENT_PROJECT_VERSION: 1
    # Bumped by release-please alongside CMakeLists.txt. It used to be pinned at 0.1.0 while the
    # project shipped 0.45.x, so any iOS artifact would have carried a version that matched nothing.
    # The release scripts truncate this to x.y before archiving, because TestFlight reviews each
    # CFBundleShortVersionString separately and the patch digit would buy a review per release. The
    # full value stays here: it is what release-please writes, and local builds never upload.
    MARKETING_VERSION: 0.48.6 # x-release-please-version
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    # Xcode 26 no longer falls back to the target name when a target leaves PRODUCT_NAME unset, so a
    # target without it links as a bare `-l` and builds products named `.xctest` or `-Runner.app`.
    # Targets that publish a different product name still override this below.
    PRODUCT_NAME: $(TARGET_NAME)
    DEVELOPMENT_TEAM: LXCL4Z68GU

targets:
  MetasequoiaAppleBridge:
    type: library.static
    platform: iOS
    sources:
      - path: shared/apple-bridge
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/common
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/core
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/english
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/japanese
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/local_modes
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/providers
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/quanpin
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/schemes
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/shuangpin
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/user_dictionary
        excludes:
          - "*.h"
      - path: vendor/MetasequoiaImeEngine/googlepinyinime-rev/src/share
        excludes:
          - "*.h"
          - maintest.cpp
    settings:
      base:
        BREW_PREFIX: /opt/homebrew
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - FMT_HEADER_ONLY=1
          - SPDLOG_FMT_EXTERNAL
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../shared/apple-bridge
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/utfcpp/source
          - $(BREW_PREFIX)/include
        SKIP_INSTALL: YES

  MetasequoiaImeIOS:
    type: application
    platform: iOS
    sources:
      - path: platforms/ios/App/Sources
      - path: shared/backend/BackendAccountClient.swift
      - path: shared/backend/BackendAccountSession.swift
      - path: shared/backend/BackendClipboardClient.swift
      - path: shared/backend/BackendPreferencesClient.swift
      - path: shared/backend/IOSPreferencePlan.swift
      - path: shared/backend/BackendDictionaryClient.swift
      - path: shared/backend/BackendCandidateClient.swift
      - path: platforms/ios/App/Services
      - path: vendor/MetasequoiaImeEngine/voice/src/provider_protocol.cpp
      - path: platforms/ios/KeyboardExtension/Resources/dictionary-manifest.json
        buildPhase: resources
      - path: platforms/ios/App/Resources/Assets.xcassets
      - path: platforms/ios/SharedUI
      - path: platforms/ios/SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # GPLv3 sections 4 and 6 require the licence to reach whoever receives the program, and the
      # bundled msime.db is built from rime-ice, which is itself GPL-3.0. macOS already packages
      # these into Resources/Licenses via CMakeLists.txt; iOS shipped neither. They go on the host
      # app rather than the keyboard extension because the extension has no UI that could present
      # them.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/mozc_dictionary_oss_README.txt
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: $(PROJECT_DIR)/../../platforms/ios/App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(PROJECT_DIR)/../../platforms/ios/App/Resources/MetasequoiaImeIOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios
        BREW_PREFIX: /opt/homebrew
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../../platforms/ios/App/Sources/App-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../shared/apple-bridge
          - $(PROJECT_DIR)/../../platforms/ios/App/Services
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include/msime/voice
          - $(BREW_PREFIX)/include
        PRODUCT_NAME: MetasequoiaIME
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MSIME iOS TestFlight Distribution
    dependencies:
      - target: MetasequoiaKeyboard
      - target: MetasequoiaAppleBridge
      - sdk: libsqlite3.tbd

  MetasequoiaKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: platforms/ios/KeyboardExtension/Sources
      - path: platforms/ios/App/Services/CustomService.swift
      - path: platforms/ios/App/Services/KeyboardAIService.swift
      - path: platforms/ios/App/Services/AppServicesBridge.mm
      - path: vendor/MetasequoiaImeEngine/voice/src/provider_protocol.cpp
      - path: platforms/ios/SharedResources/KeyboardBrand.png
        buildPhase: resources
      - path: platforms/ios/SharedUI
      - path: platforms/ios/SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/msime.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/msime.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/english.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/english.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/others.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/others.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/dict_japanese.dat
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/dict_japanese.dat.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/dictionary-manifest.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Resources/MetasequoiaKeyboard.entitlements
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboard
        PRODUCT_NAME: MetasequoiaKeyboard
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Sources/MetasequoiaKeyboard-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../shared/apple-bridge
          - $(PROJECT_DIR)/../../platforms/ios/App/Services
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include/msime/voice
          - $(BREW_PREFIX)/include
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MSIME iOS Keyboard TestFlight
    dependencies:
      - target: MetasequoiaAppleBridge
      - sdk: libsqlite3.tbd

  MetasequoiaKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: platforms/ios/KeyboardTests
      - path: platforms/ios/App/Services/SkinCommunityAPI.swift
      - path: platforms/ios/App/Services/CloudDictionaryTransfer.swift
      - path: shared/backend/BackendDictionaryClient.swift
      - path: shared/backend/BackendCandidateClient.swift
      - path: shared/backend/BackendAccountClient.swift
      - path: shared/backend/BackendAccountSession.swift
      - path: platforms/ios/KeyboardExtension/Sources
      - path: platforms/ios/App/Services/CustomService.swift
      - path: platforms/ios/App/Services/KeyboardAIService.swift
      - path: platforms/ios/App/Services/AppServicesBridge.mm
      - path: vendor/MetasequoiaImeEngine/voice/src/provider_protocol.cpp
      - path: platforms/ios/SharedResources/KeyboardBrand.png
        buildPhase: resources
      - path: platforms/ios/SharedUI
      - path: platforms/ios/KeyboardExtension/Resources/msime.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/msime.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/english.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/english.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/others.db
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/others.db.sha256
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/dict_japanese.dat
        buildPhase: resources
      - path: platforms/ios/KeyboardExtension/Resources/dict_japanese.dat.sha256
        buildPhase: resources
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboardtests
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../../platforms/ios/KeyboardExtension/Sources/MetasequoiaKeyboard-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../shared/apple-bridge
          - $(PROJECT_DIR)/../../platforms/ios/App/Services
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include/msime/voice
          - $(BREW_PREFIX)/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/include
    dependencies:
      - target: MetasequoiaAppleBridge
      - sdk: libsqlite3.tbd

  MetasequoiaServiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: platforms/ios/ServiceTests
      - path: shared/backend/BackendAccountClient.swift
      - path: shared/backend/BackendAccountSession.swift
      - path: shared/backend/BackendClipboardClient.swift
      - path: shared/backend/BackendPreferencesClient.swift
      - path: shared/backend/IOSPreferencePlan.swift
      - path: shared/backend/BackendDictionaryClient.swift
      - path: shared/backend/BackendCandidateClient.swift
      - path: platforms/ios/App/Services/CustomService.swift
      - path: platforms/ios/App/Services/AppServicesBridge.mm
      - path: vendor/MetasequoiaImeEngine/voice/src/provider_protocol.cpp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.servicetests
        BREW_PREFIX: /opt/homebrew
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/../../platforms/ios/App/Services/AppServicesBridge.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include
          - $(PROJECT_DIR)/../../vendor/MetasequoiaImeEngine/voice/include/msime/voice
          - $(BREW_PREFIX)/include

  MetasequoiaImeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: platforms/ios/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.uitests
    dependencies:
      - target: MetasequoiaImeIOS

schemes:
  MetasequoiaImeIOS:
    build:
      targets:
        MetasequoiaImeIOS: all
        MetasequoiaKeyboard: all
    run:
      config: Debug
    test:
      targets:
        - MetasequoiaImeIOSUITests
        - MetasequoiaKeyboardTests
        - MetasequoiaServiceTests
