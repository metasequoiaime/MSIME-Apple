name: MSIMEClient
options:
  deploymentTarget:
    iOS: "16.0"
  bundleIdPrefix: app.msime.ios
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: LXCL4Z68GU
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_NAME: "$(TARGET_NAME)"
schemes:
  MSIMEClientTests:
    build:
      targets:
        MSIMEKeyboardTests: all
        MSIMEServiceTests: all
        MSIMESharedTests: all
    test:
      targets:
        - MSIMEKeyboardTests
        - MSIMEServiceTests
        - MSIMESharedTests
  MSIMEDoubaoTransportTests:
    build:
      targets:
        MSIMEDoubaoTransportTests: all
    test:
      targets:
        - MSIMEDoubaoTransportTests
targets:
  MSIMEClientApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Services
      - path: ../../shared/backend
        excludes:
          - Tests/**
          - Package.swift
          - .build/**
      - path: ../../shared/backend-ui
      - path: SharedUI
      - path: ../../target/ios/EngineResources/dictionary-manifest.json
        buildPhase: resources
      - path: SharedResources/MLKit-NOTICES.txt
        buildPhase: resources
      - path: SharedResources/MLKit-Dependencies.txt
        buildPhase: resources
      - path: SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios
        PRODUCT_NAME: MSIMEClientApp
        CODE_SIGN_ENTITLEMENTS: App/Resources/MSIMEClientApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "仅在你开始语音输入时录音，并发送到你配置的语音识别服务。"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
          - "-framework"
          - Foundation
          - "-framework"
          - UIKit
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
    dependencies:
      - target: MSIMEKeyboardExtension
      - sdk: Security.framework
  MSIMEKeyboardExtension:
    type: app-extension
    platform: iOS
    info:
      path: KeyboardExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: 水杉输入法
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    sources:
      - path: KeyboardExtension/Sources
        excludes:
          - KeyboardServiceFallback.swift
      - path: SharedUI
      - path: ../../shared/backend/BackendAccountClient.swift
      - path: ../../shared/backend/BackendChatClient.swift
      - path: ../../shared/backend/BackendAccountSession.swift
      - path: ../../shared/backend/BackendAnonymousAccount.swift
      - path: ../../shared/backend/BackendLocalStore.swift
      - path: ../../shared/backend/BackendSnapshotClient.swift
      - path: App/Services/KeyboardAIService.swift
      - path: KeyboardExtension/Sources/KeyboardServiceFallback.swift
      - path: ../../target/ios/EngineResources
        buildPhase: resources
        type: folder
      - path: SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboard
        PRODUCT_NAME: MSIMEKeyboardExtension
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/Resources/MSIMEKeyboardExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/KeyboardExtension/Sources/MetasequoiaKeyboard-Bridging-Header.h"
        EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]: HandwritingInputViewFallback.swift
        EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]: HandwritingInputView.swift HandwritingDownloadSession.m
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
    dependencies:
      - sdk: Security.framework
  MSIMEKeyboardTestHost:
    type: application
    platform: iOS
    sources:
      - path: KeyboardTestHost
      - path: ../../target/ios/EngineResources
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboard-test-host
        PRODUCT_NAME: MSIMEKeyboardTestHost
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  MSIMEKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyboardTests
      - path: App/Services/AISkinService.swift
      - path: App/Services/CloudDictionaryTransfer.swift
      - path: App/Services/CommunityPreviewFixtures.swift
      - path: App/Services/DoubaoHostFrameCodec.swift
      - path: App/Services/DoubaoVoiceCoordinator.swift
      - path: App/Services/DoubaoWebSocketTransport.swift
      - path: App/Services/KeyboardAIService.swift
      - path: App/Services/SkinCommunityAPI.swift
      - path: ../../shared/backend
        excludes:
          - Tests/**
          - Package.swift
          - .build/**
      - path: KeyboardExtension/Sources
        excludes:
          - HandwritingInputView.swift
      - path: SharedUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboard-tests
        PRODUCT_NAME: MSIMEKeyboardTests
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MSIMEKeyboardTestHost.app/MSIMEKeyboardTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
    dependencies:
      - target: MSIMEKeyboardTestHost
      - sdk: Security.framework
  MSIMEServiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServiceTests
      - path: App/Sources/AppIconSettingsView.swift
      - path: App/Services/CustomService.swift
      - path: App/Services/DoubaoHostFrameCodec.swift
      - path: App/Services/DoubaoVoiceCoordinator.swift
      - path: App/Services/DoubaoWebSocketTransport.swift
      - path: App/Services/WAVPCMExtractor.swift
      - path: SharedUI/AppServicesBridge.swift
      - path: SharedUI/MetasequoiaTheme.swift
      - path: ../../shared/backend
        excludes:
          - Tests/**
          - Package.swift
          - .build/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.service-tests
        PRODUCT_NAME: MSIMEServiceTests
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
    dependencies:
      - sdk: Security.framework
  MSIMESharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
        excludes:
          - ChineseTextConversionTests.swift
          - EnglishCapitalizationPolicyTests.swift
          - FrequencyAdjustmentPreferenceTests.swift
          - HandwritingTests.swift
          - build-native.sh
          - tools/**
      - path: KeyboardTests/InputSchemeTestSupport.swift
      - path: App/Services/CustomService.swift
      - path: App/Services/DoubaoHostFrameCodec.swift
      - path: App/Services/DoubaoVoiceCoordinator.swift
      - path: App/Services/DoubaoWebSocketTransport.swift
      - path: App/Services/KeyboardAIService.swift
      - path: ../../shared/backend
        excludes:
          - Tests/**
          - Package.swift
          - .build/**
      - path: KeyboardExtension/Sources
        excludes:
          - HandwritingInputView.swift
          - KeyboardServiceFallback.swift
      - path: SharedUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.shared-tests
        PRODUCT_NAME: MSIMESharedTests
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MSIMEKeyboardTestHost.app/MSIMEKeyboardTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
    dependencies:
      - target: MSIMEKeyboardTestHost
      - sdk: Security.framework
  MSIMEDoubaoTransport:
    type: framework
    platform: iOS
    sources:
      - path: App/Services/DoubaoWebSocketTransport.swift
      - path: App/Services/DoubaoVoiceCoordinator.swift
      - path: App/Services/WAVPCMExtractor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.transport
        PRODUCT_NAME: MSIMEDoubaoTransport
        ENABLE_TESTABILITY: YES
  MSIMEDoubaoTransportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TransportTests
    dependencies:
      - target: MSIMEDoubaoTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.transport.tests
        PRODUCT_NAME: MSIMEDoubaoTransportTests
