name: MSIMEClient
options:
  deploymentTarget:
    iOS: "16.0"
  bundleIdPrefix: com.metasequoiaime
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_NAME: "$(TARGET_NAME)"
schemes:
  MSIMEDoubaoTransportTests:
    build:
      targets:
        MSIMEDoubaoTransportTests: all
    test:
      targets:
        - MSIMEDoubaoTransportTests
targets:
  MSIMEClientApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Services
      - path: ../../shared/backend
        excludes:
          - Tests/**
          - Package.swift
      - path: ../../shared/backend-ui
      - path: SharedUI
      - path: ../../target/ios/EngineResources/dictionary-manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client
        PRODUCT_NAME: MSIMEClientApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于语音输入"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
          - "-framework"
          - Foundation
          - "-framework"
          - UIKit
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
    dependencies:
      - target: MSIMEKeyboardExtension
  MSIMEKeyboardExtension:
    type: app-extension
    platform: iOS
    info:
      path: KeyboardExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: 水杉输入法
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    sources:
      - path: KeyboardExtension/Sources
        excludes:
          - HandwritingInputView.swift
      - path: SharedUI
      - path: ../../shared/backend/BackendAccountClient.swift
      - path: ../../shared/backend/BackendSnapshotClient.swift
      - path: App/Services/KeyboardAIService.swift
      - path: KeyboardExtension/Sources/KeyboardServiceFallback.swift
      - path: ../../target/ios/EngineResources
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client.keyboard
        PRODUCT_NAME: MSIMEKeyboardExtension
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
  MSIMEClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyboardTests
      - path: ServiceTests
      - path: tests
    dependencies:
      - target: MSIMEClientApp
  MSIMEDoubaoTransport:
    type: framework
    platform: iOS
    sources:
      - path: App/Services/DoubaoWebSocketTransport.swift
      - path: App/Services/DoubaoVoiceCoordinator.swift
      - path: App/Services/WAVPCMExtractor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client.transport
        PRODUCT_NAME: MSIMEDoubaoTransport
        ENABLE_TESTABILITY: YES
  MSIMEDoubaoTransportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TransportTests
    dependencies:
      - target: MSIMEDoubaoTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client.transport.tests
        PRODUCT_NAME: MSIMEDoubaoTransportTests
